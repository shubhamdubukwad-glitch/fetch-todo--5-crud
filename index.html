<body>
    <h1 class="text-center text-white">POST FORM UI -5..!!</h1>
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-6 offset-3">
                <div class="card">
                    <div class="card-body">
                        <form id="postForm">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input type="text" class="form-control" id="title">
                            </div>
                            <div class="form-group">
                                <label for="body">Content</label>
                                <textarea type="text" class="form-control" id="body"></textarea>
                            </div>
                            <div class="form-group">
                                <label for="userID">userID</label>
                                <select type="text" class="form-control" id="userID">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>
                            <button id="addPostBtn" class="btn btn-primary btn-sm btn-block">Add Post</button>
                            <button id="updatePostBtn" type="button"
                                class="btn btn-danger btn-sm btn-block d-none">Update
                                Post</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
